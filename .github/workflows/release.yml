name: Release

# Pushing a version tag (e.g. v1.8.0) runs tests, builds the Chrome / Edge /
# Firefox zips, and attaches them to a GitHub Release. workflow_dispatch
# builds the same zips as workflow artifacts without publishing a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build browser packages
        run: npm run build

      - name: Lint Firefox build (web-ext)
        run: npx --yes web-ext lint --source-dir dist/staging/firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
